<script>
"use strict";
/* ---------- constants ---------- */
const DEFN={cup:"Cup Series",busch:"O'Reilly Series",truck:"Truck Series"},DEFK=["cup","busch","truck"];
let SERIES=DEFK.map(k=>[k,DEFN[k]]);
const PALETTE=["#8e44ad","#c0392b","#16a085","#d68910","#2c3e50","#e84393","#0984e3","#6ab04c"];
function refreshSeries(){
  const by=new Map();
  Object.values(docs).forEach(d=>{if(!d||!d.series)return;let e=by.get(d.series);if(!e){e={k:d.series,ord:d.ord||0,y:-1,name:DEFN[d.series]||d.series};by.set(d.series,e)}
    if(d.ord&&(!e.ord||d.ord<e.ord))e.ord=d.ord;if(d.year>=e.y&&d.name){e.y=d.year;e.name=d.name}});
  if(!by.size)return;
  const arr=[...by.values()].sort((a,b)=>{const ia=DEFK.indexOf(a.k),ib=DEFK.indexOf(b.k);if(ia>=0||ib>=0)return (ia<0?99:ia)-(ib<0?99:ib);return (a.ord-b.ord)||a.k.localeCompare(b.k)});
  SERIES=arr.map(e=>[e.k,e.name]);
}
const codesOf=k=>{const dd=docsFor(k).find(x=>x.code);return dd?String(dd.code).split(/[\s,;]+/).filter(Boolean):[]};
const SER_BASE={NCS:"cup",NBS:"busch",NXS:"busch",NNS:"busch",NTS:"truck",NCTS:"truck",CTS:"truck"};
function codeMap(){const m=Object.assign({},SER_BASE);SERIES.forEach(([k])=>codesOf(k).forEach(c=>{m[c.toUpperCase()]=k}));return m}
const VIEWS=[["overview","Overview"],["schedule","Schedule"],["exhib","Exhibitions"],["standings","Standings"],["stats","Stats"],["teams","Teams"],["tracks","Tracks"],["history","History"],["drivers","Drivers"],["roster","Roster"],["ratings","Ratings"],["setup","Setup"]];
const RATE=[["agg","Aggression","d"],["con","Consistency","d"],["fin","Finishing","d"],["qua","Qualifying","d"],["st","Short track","d"],["spd","Speedway","d"],["ss","Superspeedway","d"],["rd","Road course","d"],["pcc","Pit consistency","p"],["pcs","Pit speed","p"],["pcg","Pit strategy","p"],["vae","Aero","v"],["vch","Chassis","v"],["ven","Engine","v"],["vre","Reliability","v"]];
const AIMAP={aiParamDriverAggression:"agg",aiParamDriverConsistency:"con",aiParamDriverFinishing:"fin",aiParamDriverQualifying:"qua",aiParamDriverShortTrack:"st",aiParamDriverSpeedway:"spd",aiParamDriverSuperspeedway:"ss",aiParamDriverRoadCourse:"rd",aiParamPitcrewConsistency:"pcc",aiParamPitcrewSpeed:"pcs",aiParamPitcrewStrategy:"pcg",aiParamVehicleAero:"vae",aiParamVehicleChassis:"vch",aiParamVehicleEngine:"ven",aiParamVehicleReliability:"vre"};
function rg(x,k){const v=x.r&&x.r[k];if(v==null)return null;return typeof v==="number"?{a:Math.round(v),b:Math.round(v)}:{a:Math.round(v.a),b:Math.round(v.b)}}
const rmean=(x,k)=>{const v=rg(x,k);return v?(v.a+v.b)/2:null};
const rtxt=v=>v?(v.a===v.b?fmt(v.a,v.a%1?1:0):fmt(v.a,v.a%1?1:0)+"–"+fmt(v.b,v.b%1?1:0)):"–";
function avgRate(x,g="d"){const v=RATE.filter(r=>r[2]===g).map(r=>rmean(x,r[0])).filter(v=>v!=null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null}
const f1=n=>String(Math.round(n*10)/10);
const heat=v=>v==null?"transparent":`hsl(${Math.round(Math.max(0,Math.min(1,(v-50)/50))*120)} 68% 48% / .3)`;
const meanOf=a=>{const z=a.filter(v=>v!=null);return z.length?z.reduce((p,q)=>p+q,0)/z.length:null};
const PO=d=>d.settings.playoff||(d.settings.playoff={on:false,after:26,sizes:"16,12,8,4",races:"3,3,3,1",resets:"2000,3000,4000,5000",win:5,winAdv:true});
const parseList=v=>String(v==null?"":v).split(/[\s,;]+/).filter(Boolean).map(Number).filter(n=>!isNaN(n));
function playoffBounds(d){
  const po=PO(d),sz=parseList(po.sizes),rc=parseList(po.races),out={};
  let idx=po.after|0;if(!idx||!sz.length)return out;
  out[idx]=`The playoffs begin · field of ${sz[0]}`;
  for(let r=0;r<sz.length;r++){if(r>0)out[idx]=r===sz.length-1?`Championship round · ${sz[r]} drivers`:`Round of ${sz[r]} begins`;idx+=rc[r]||1}
  return out;
}
function playoffState(d){
  const po=PO(d);if(!po.on)return null;
  const after=po.after|0,sizes=parseList(po.sizes),rcs=parseList(po.races),resets=parseList(po.resets);
  if(!after||!sizes.length)return {need:true};
  if(d.races.length<after||!d.races.slice(0,after).every(r=>r.done))return {pre:true,after,size:sizes[0]};
  const pmap=d.races.map(r=>r.done?racePoints(d,r):null);
  const drv=new Map(d.drivers.filter(x=>x.pf).map(x=>[x.id,x]));
  const reg=new Map(),rw=new Map();drv.forEach((x,id)=>{reg.set(id,0);rw.set(id,0)});
  for(let i=0;i<after;i++)(d.races[i].res||[]).forEach(x=>{if(!drv.has(x.d))return;reg.set(x.d,reg.get(x.d)+(pmap[i].get(x.d)||0));if(x.f===1)rw.set(x.d,rw.get(x.d)+1)});
  const dpo=duelPts(d);if(dpo.on)(d.exh||[]).forEach(ev=>{if(ev.kind==="Duel"&&ev.done)(ev.res||[]).forEach(x=>{if(reg.has(x.d))reg.set(x.d,reg.get(x.d)+(dpo.pts[x.f-1]||0))})});
  const ids=[...drv.keys()],cmp=(a,b)=>(reg.get(b)-reg.get(a))||(rw.get(b)-rw.get(a));
  const n0=Math.min(sizes[0],ids.length);let field;
  if(po.winAdv){const w=ids.filter(i=>rw.get(i)>0).sort(cmp),nw=ids.filter(i=>rw.get(i)===0).sort(cmp);field=w.slice(0,n0).concat(nw.slice(0,Math.max(0,n0-w.length)))}
  else field=[...ids].sort(cmp).slice(0,n0);
  const carried=new Map();field.forEach(i=>carried.set(i,rw.get(i)));

const postStart=d=>{if(d.__ps!==undefined)return d.__ps<0?null:d.__ps;const c=d.settings.chase,p=PO(d);return c.on&&c.after?c.after:(p.on&&p.after?p.after:null)};

const ppWin=d=>{if(d.__ppw!==undefined)return d.__ppw;const c=d.settings.chase,p=PO(d);return c.on?(+c.win||0):(p.on?(+p.win||0):0)};

  if(mode==="post")return d;

  const settings=Object.assign({},d.settings,{chase:Object.assign({},d.settings.chase,{on:false}),playoff:Object.assign({},PO(d),{on:false})});

function racePoints(d,r,idx){
  const s=d.settings,t=tableFor(d,idx!=null?idx:d.races.indexOf(r)),res=r.res||[],m=new Map();

    p+=stp.get(x.d)||0;
    if(x.l>0)p+=s.led||0;

function agg(list,keyFn){

      const key=keyFn(d,dr);let s=m.get(key);
      if(!s){s={key,pts:0,reg:0,post:0,regWins:0,starts:0,wins:0,t5:0,t10:0,t20:0,poles:0,led:0,dnf:0,sf:0,ss:0,best:99,laps:0,stw:0,stp:0,pp:0,dp:0};m.set(key,s)}

    };
    d.drivers.forEach(dr=>{const s=get(dr);Object.assign(s,{id:dr.id,name:dr.name,num:dr.num,team:dr.team,make:dr.make,pf:dr.pf,rookie:dr.rookie})});
    const dpo=duelPts(d);

function trackIndex(scope){
  const list=scope==="all"?Object.values(docs).sort((a,b)=>a.year-b.year||a.series.localeCompare(b.series)):docsFor(ui.series);
  const m=new Map();
  list.forEach(dd=>dd.races.forEach((r,i)=>{
    const nm=(r.track||"").trim();if(!r.done||!nm)return;
    const key=normTrack(nm)||nm.toLowerCase();let t=m.get(key);
    if(!t){t={key,name:nm,type:"",len:"",events:[]};m.set(key,t)}
    if(!t.type&&r.type)t.type=r.type;if(!t.len&&r.len)t.len=r.len;
    t.events.push({dd,r,i});
  }));
  return [...m.values()];
}

  t.events.forEach(({dd,r})=>{const nm=new Map(dd.drivers.map(z=>[z.id,z]));(r.res||[]).forEach(x=>{
    const dr=nm.get(x.d);if(!dr)return;const k=dr.name.trim().toLowerCase();let s=m.get(k);
    if(!s){s={name:dr.name,num:dr.num,starts:0,wins:0,poles:0,t5:0,t10:0,led:0,sf:0,best:99};m.set(k,s)}
    s.num=dr.num;s.starts++;if(x.f===1)s.wins++;if(x.s===1)s.poles++;if(x.f<=5)s.t5++;if(x.f<=10)s.t10++;s.led+=x.l||0;s.sf+=x.f;if(x.f<s.best)s.best=x.f})});

}

function exhStats(list,keyFn,kind){
  const m=new Map();
  list.forEach(d=>{const dm=new Map(d.drivers.map(x=>[x.id,x]));
    (d.exh||[]).forEach(ev=>{if(!ev.done||(kind&&kind!=="all"&&ev.kind!==kind))return;(ev.res||[]).forEach(x=>{
      const dr=dm.get(x.d);if(!dr)return;const key=keyFn(d,dr);let s=m.get(key);
      if(!s){s={key,starts:0,wins:0,t5:0,poles:0,led:0,sf:0,best:99,k:{}};m.set(key,s)}
      s.name=dr.name;s.num=dr.num;s.starts++;if(x.f===1){s.wins++;s.k[ev.kind]=(s.k[ev.kind]||0)+1}
      if(x.f<=5)s.t5++;if(x.s===1)s.poles++;s.led+=x.l||0;s.sf+=x.f;if(x.f<s.best)s.best=x.f})})});

}

async function wdLookup(name){
  const base="https://www.wikidata.org/w/api.php?format=json&origin=*",j=async u=>{const r=await fetch(u);if(!r.ok)throw new Error("http");return r.json()};
  const sr=await j(base+"&action=wbsearchentities&language=en&type=item&limit=7&search="+encodeURIComponent(name));
  const ids=(sr.search||[]).map(x=>x.id);if(!ids.length)return null;
  const g=await j(base+"&action=wbgetentities&props=claims|descriptions|labels&languages=en&ids="+ids.join("|"));
  for(const id of ids){const e=(g.entities||{})[id];if(!e)continue;
    const desc=(e.descriptions&&e.descriptions.en&&e.descriptions.en.value)||"";
    const c=e.claims&&e.claims.P569&&e.claims.P569[0],bd=c&&c.mainsnak&&c.mainsnak.datavalue&&c.mainsnak.datavalue.value;
    if(!bd||!/driver|racer|racing|nascar|motorsport/i.test(desc))continue;
    const m=String(bd.time).match(/^\+?(\d{4})-(\d\d)-(\d\d)/);if(!m)continue;
    return {label:(e.labels&&e.labels.en&&e.labels.en.value)||name,desc,y:+m[1],mo:+m[2]||6,da:+m[3]||15};}
  return null;
}

async function ageRun(m){
  const names=new Map();
  SERIES.forEach(([k])=>{const dd=docs[docId(k,ui.year)];if(dd)dd.drivers.forEach(x=>{const key=x.name.trim().toLowerCase();if(key&&!names.has(key))names.set(key,{name:x.name.trim(),cur:x.age==null?"":x.age})})});
  const list=[...names.values()];m.total=list.length;m.done=0;m.status="running";m.rows=[];m.miss=[];renderModal();
  let q=0,fail=0;
  const work=async()=>{while(q<list.length&&ui.modal===m){const it=list[q++];
    try{const f=await wdLookup(it.name);if(f){const age=ageOn(f,m.ref);m.rows.push(Object.assign({name:it.name,cur:it.cur,age},f,{use:it.cur===""}))}else m.miss.push(it.name)}
    catch(e){fail++;if(fail>=3&&!m.rows.length){q=list.length}}
    m.done++;if(m.done%3===0||m.done===m.total)if(ui.modal===m)renderModal()}};
  await Promise.all([work(),work(),work()]);

  m.rows.sort((a,b)=>a.name.localeCompare(b.name));
  m.status=fail&&!m.rows.length?"error":"done";renderModal();
}

const SG=[["ov","Overall","every driver rating"],["ag","Age","every driver rating"],["qua","Qualifying","Qualifying"],["fin","Finishing","Finishing"],["con","Consistency","Consistency"]];
function pctRank(vals,v){ // 0..1, higher value = higher rank
  if(vals.length<2)return .5;let below=0,eq=0;vals.forEach(o=>{if(o<v)below++;else if(o===v)eq++});return (below+(eq-1)/2)/(vals.length-1);
}
function ageTrend(age,scale){ // development for the young, decline for the old; 0 at the peak (27 to 33)
  const a=age===""||age==null||isNaN(age)?null:+age;if(a==null)return 0;
  const raw=a<27?Math.min(3,(27-a)*.5):a>33?-Math.min(4,(a-33)*.5):0;
  return Math.round(raw*scale/4);
}
function suggestions(d,scale,minS,useAge){
  if(useAge===undefined)useAge=true;
  const m=agg([d],(dd,x)=>x.id);
  const el=[...m.values()].filter(z=>z.starts>=minS&&z.avgF!=null&&avgRate(drvOf(d,z.id),"d")!=null);
  if(el.length<3)return [];
  const dnfR=z=>z.dnf/z.starts,gain=z=>z.avgS!=null?z.avgS-z.avgF:null;
  const perfAll=el.map(z=>-z.avgF),rateAll=el.map(z=>avgRate(drvOf(d,z.id),"d"));
  const q=(arr,f,x)=>{const a=arr.map(f).filter(v=>v!=null);const v=f(x);return v==null||a.length<3?null:pctRank(a,v)};
  return el.map(z=>{
    const x=drvOf(d,z.id),sh=z.starts/(z.starts+8);
    const gOv=pctRank(perfAll,-z.avgF)-pctRank(rateAll,avgRate(x,"d"));
    const trait=(key,perfFn)=>{const rv=rmean(x,key);if(rv==null)return 0;
      const rp=pctRank(el.map(o=>rmean(drvOf(d,o.id),key)).filter(v=>v!=null),rv),pp=q(el,perfFn,z);
      if(pp==null)return 0;return ((pp-rp)-gOv)*scale*.5*sh};
    const h=v=>Math.round(v);
    return {id:z.id,x,starts:z.starts,avgF:z.avgF,avgS:z.avgS,wins:z.wins,rating:avgRate(x,"d"),
      ag:useAge?ageTrend(x.age,scale):0,ov:h(gOv*scale*sh),qua:h(trait("qua",o=>o.avgS!=null?-o.avgS:null)),fin:h(trait("fin",gain)),con:h(trait("con",o=>-dnfR(o)))};
  }).sort((a,b)=>(b.ov+b.ag+b.qua+b.fin+b.con)-(a.ov+a.ag+a.qua+a.fin+a.con));
}

function mergeScan(series,fromName,toName){
  const lc=v=>String(v||"").trim().toLowerCase(),out=[];
  docsFor(series).forEach(dd=>{
    const a=dd.drivers.filter(x=>lc(x.name)===lc(fromName)),b=dd.drivers.find(x=>lc(x.name)===lc(toName));
    if(!a.length)return;
    const ids=new Set(a.map(x=>x.id));
    const used=[...dd.races,...(dd.exh||[])].filter(r=>(r.res||[]).some(z=>ids.has(z.d))).length;
    const both=b?[...dd.races,...(dd.exh||[])].filter(r=>(r.res||[]).some(z=>ids.has(z.d))&&(r.res||[]).some(z=>z.d===b.id)).length:0;
    out.push({dd,a,b,used,both});
  });
  return out;
}

/* ---------- build ratings from results ---------- */
const BL_KEYS=[["agg","Aggression"],["con","Consistency"],["fin","Finishing"],["qua","Qualifying"],["st","Short track"],["spd","Speedway"],["ss","Superspeedway"],["rd","Road course"]];
const BL_TYPE={st:"Short track",spd:"Intermediate",ss:"Superspeedway",rd:"Road course"};
function buildRatings(d,mo){
  const m=agg([d],(dd,x)=>x.id),el=[...m.values()].filter(z=>z.starts>=mo.min&&z.avgF!=null);
  if(el.length<3)return {rows:[],skipped:m.size};
  const rank=(vals,v)=>pctRank(vals,v);
  const ovAll=el.map(z=>-z.avgF);
  const gain=z=>z.avgS!=null&&z.avgS>0?z.avgS-z.avgF:null;
  const lo=mo.lo,hi=mo.hi,val=pct=>lo+Math.max(0,Math.min(1,pct))*(hi-lo);
  // per-type finishes
  const typ={};Object.keys(BL_TYPE).forEach(k=>{const mp=new Map();d.races.forEach(r=>{if(!r.done||r.type!==BL_TYPE[k])return;(r.res||[]).forEach(x=>{const a=mp.get(x.d)||[];a.push(x.f);mp.set(x.d,a)})});typ[k]=mp});
  const rows=el.map(z=>{
    const x=drvOf(d,z.id),ov=rank(ovAll,-z.avgF),v={};
    const blend=(p,n,k0)=>{const w=n/(n+k0);return p==null?ov:w*p+(1-w)*ov};
    const gl=el.map(gain).filter(g=>g!=null),dn=el.map(o=>-o.dnf/o.starts),sl=el.filter(o=>o.avgS!=null&&o.avgS>0).map(o=>-o.avgS);
    v.agg=val(ov);
    v.con=val(blend(rank(dn,-z.dnf/z.starts),z.starts,6));
    v.fin=val(blend(gain(z)==null||gl.length<3?null:rank(gl,gain(z)),z.starts,6));
    v.qua=val(blend(z.avgS>0&&sl.length>=3?rank(sl,-z.avgS):null,z.starts,6));
    Object.keys(BL_TYPE).forEach(k=>{
      const mine=typ[k].get(z.id)||[],n=mine.length;
      let pc=null;
      if(n){const avgs=[...typ[k].entries()].filter(([id,a])=>a.length>=2).map(([id,a])=>-a.reduce((p,q)=>p+q,0)/a.length);
        if(avgs.length>=3&&n>=2)pc=rank(avgs,-mine.reduce((p,q)=>p+q,0)/n)}
      v[k]=val(blend(pc,n,3));
    });
    BL_KEYS.forEach(([k])=>{v[k]=Math.round(Math.max(0,Math.min(100,v[k])))});
    return {id:z.id,x,starts:z.starts,avgF:z.avgF,wins:z.wins,v};
  }).sort((a,b)=>a.avgF-b.avgF);
  return {rows,skipped:m.size-el.length};
}
const blVal=(r,k,mo)=>{const a=mo.adj[r.id+":"+k];return a!=null?a:r.v[k]};

function parseNR(text){
  const doc=new DOMParser().parseFromString(text,"text/html");
  const out={track:"",date:"",race:[],qual:[],cautions:"",lc:""};let sess="";
  doc.querySelectorAll("h3,table").forEach(el=>{
    if(el.tagName==="H3"){
      const t=el.textContent.replace(/\s+/g," ").trim();let m;
      if((m=t.match(/^Track:\s*(.+)/i)))out.track=m[1];
      else if((m=t.match(/^Date:\s*(.+)/i)))out.date=m[1];
      else if((m=t.match(/^Session:\s*(.+)/i)))sess=m[1].toLowerCase();
      else if((m=t.match(/^Caution Flags:\s*(\d+)/i)))out.cautions=m[1];
      else if((m=t.match(/^Lead Changes:\s*(\d+)/i)))out.lc=m[1];
      return;
    }
    const rows=[...el.querySelectorAll("tr")].map(tr=>[...tr.querySelectorAll("td")].map(td=>td.textContent.replace(/\s+/g," ").trim()));
    if(rows.length<2)return;
    const hdr=rows[0].map(h=>h.toLowerCase()),ix=n=>hdr.indexOf(n);
    if(sess.includes("race")&&ix("f")>=0){
      const rr=[];
      rows.slice(1).forEach(c=>{const f=parseInt(c[ix("f")],10);if(!f||!c[ix("driver")])return;
        rr.push({f,s:parseInt(c[ix("s")],10)||0,num:c[ix("#")],name:c[ix("driver")],laps:parseInt(c[ix("laps")],10)||0,led:parseInt(c[ix("led")],10)||0,pts:parseInt(c[ix("points")],10),status:c[ix("status")]||"Running",iv:ix("interval")>=0?(c[ix("interval")]||""):""})});
      if(rr.length)out.race=rr;
    }else if(sess.includes("qual")&&ix("p")>=0){
      const q=[];rows.slice(1).forEach(c=>{const p=parseInt(c[ix("p")],10);if(p)q.push({p,num:c[ix("#")],name:c[ix("driver")],time:c[ix("time")]})});
      if(q.length)out.qual=q;
    }
  });
  return out;
}
const normTrack=s=>String(s||"").toLowerCase().replace(/international|motor|super|speedway|raceway|motorsports|park|the/g,"").replace(/[^a-z0-9]/g,"");
const trackMatch=(a,b)=>{a=normTrack(a);b=normTrack(b);return !!a&&!!b&&(a.includes(b)||b.includes(a))};

    if(!dr&&x.name){dr=mkDriver();dr.num=x.num||"";dr.name=x.name;d.drivers.push(dr);added++}
    if(dr)q.push({d:dr.id,p:x.p,t:x.time||""})});
  q.sort((a,b)=>a.p-b.p);r.qual=q;r.qsrc="";
  if(!r.track&&p.track)r.track=titleCase(p.track);
  if(!r.name)r.name=titleCase(p.track||"Race");
  return {added};
}
function applyNR(d,r,p){
  let added=0;const rows=[];
  p.race.forEach(x=>{
    let dr=d.drivers.find(z=>z.name.trim().toLowerCase()===x.name.toLowerCase());
    if(!dr){dr=mkDriver();dr.num=x.num;dr.name=x.name;d.drivers.push(dr);added++}
    else if(!dr.num)dr.num=x.num;
    rows.push({d:dr.id,f:x.f,s:x.s,l:x.led,n:x.laps,x:x.status||"Running",i:x.iv||""});
  });
  r.res=rows;r.done=true;
  if(!r.track&&p.track)r.track=titleCase(p.track);
  if(!r.name)r.name=titleCase(p.track||"Race");
  r.cautions=p.cautions;r.lc=p.lc;
  if(p.qual&&p.qual.length&&!(r.qual&&r.qual.length&&(r.kind==="Duel"||r.qsrc==="lineup"))){
    const q=[];p.qual.forEach(x=>{const dr=d.drivers.find(z=>z.name.trim().toLowerCase()===String(x.name||"").toLowerCase());if(dr)q.push({d:dr.id,p:x.p,t:x.time||""})});

  else if(ed==="table"){const a=val.split(/[\s,]+/).map(Number).filter(n=>!isNaN(n)&&n>=0);if(a.length)d.settings.table=a;else{toast("Enter at least one number");t.value=d.settings.table.join(", ")}}
  touch(id);
});
function moveQ(from,to){
  const m=ui.modal;if(!m||m.type!=="race"||!m.qrows||to<0||to>=m.qrows.length||from===to)return;
  const [r]=m.qrows.splice(from,1);m.qrows.splice(to,0,r);m.qrows.forEach((x,i)=>x.p=i+1);renderModal();
}
function moveRow(from,to){
  const m=ui.modal;if(!m||m.type!=="race"||to<0||to>=m.rows.length||from===to)return;
  const [r]=m.rows.splice(from,1);m.rows.splice(to,0,r);m.rows.forEach((x,i)=>x.f=i+1);renderModal();
}
function modalEdit(t,commit){
  const m=ui.modal;if(!m||m.type!=="race")return;
  const i0=+t.dataset.i,row=m.rows[i0];if(!row)return;
  const k=t.dataset.m;
  if(k==="f"){if(commit){const v=Math.round(num(t.value));const to=Math.max(0,Math.min(m.rows.length-1,v-1));if(to===i0){t.value=i0+1}else setTimeout(()=>moveRow(i0,to),0)}return}
  row[k]=(k==="d"||k==="x"||k==="i")?t.value:(t.value===""?(k==="s"||k==="p"?"":0):num(t.value));
  if(k==="d"){const td=t.closest("td");if(td)td.classList.toggle("bad",!t.value)}
  if(k==="p")t.classList.toggle("ovr",t.value!=="");
  if(m.exh)return;
  const am=ptsFor(cur(),m.rows,true);
  m.rows.forEach((x,i)=>{const e=document.querySelector(`input[data-m="p"][data-i="${i}"]`);if(e)e.placeholder=x.d&&am.has(x.d)?am.get(x.d):""});
}
/* drag to reorder (races in the schedule, drivers in a result) */
let dragSrc=null;
const DROP={
  race:(a,b)=>{const d=cur(),i=d.races.findIndex(r=>r.id===a),j=d.races.findIndex(r=>r.id===b);if(i<0||j<0||i===j)return;const [r]=d.races.splice(i,1);d.races.splice(j,0,r);touch(docId(d.series,d.year));render()},
  row:(a,b)=>moveRow(+a,+b),
  qrow:(a,b)=>moveQ(+a,+b)
};
const clearDrop=()=>document.querySelectorAll(".dropover,.dragging").forEach(e=>e.classList.remove("dropover","dragging"));
document.addEventListener("dragstart",e=>{const g=e.target.closest&&e.target.closest("[data-drag]");if(!g)return;dragSrc={kind:g.dataset.drag,key:g.dataset.key};const tr=g.closest("tr");
  try{e.dataTransfer.setData("text/plain","row");e.dataTransfer.effectAllowed="move";if(tr)e.dataTransfer.setDragImage(tr,12,12)}catch(_){}
  if(tr)tr.classList.add("dragging")});
document.addEventListener("dragover",e=>{if(!dragSrc)return;const tr=e.target.closest&&e.target.closest('[data-drop="'+dragSrc.kind+'"]');if(tr){e.preventDefault();document.querySelectorAll(".dropover").forEach(x=>x.classList.remove("dropover"));tr.classList.add("dropover")}});
document.addEventListener("dragend",()=>{dragSrc=null;clearDrop()});
document.addEventListener("drop",e=>{if(!dragSrc)return;const tr=e.target.closest&&e.target.closest('[data-drop="'+dragSrc.kind+'"]');if(!tr)return;e.preventDefault();const src=dragSrc;dragSrc=null;clearDrop();DROP[src.kind](src.key,tr.dataset.key)});
document.addEventListener("dragover",e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes("Files"))e.preventDefault()});
document.addEventListener("drop",e=>{if(e.dataTransfer&&e.dataTransfer.files.length){e.preventDefault();const all=[...e.dataTransfer.files],cars=all.filter(f=>/\.car$/i.test(f.name)),fs=all.filter(f=>/\.html?$/i.test(f.name)),ini=all.filter(f=>/\.ini$/i.test(f.name));if(ini.length)importIni(ini);if(cars.length)importCars(cars);if(fs.length){if(ui.view==="exhib")importExh(fs);else importFiles(fs,null)}}});
boot();
</script>
